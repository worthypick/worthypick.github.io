<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Worthy Pick | Admin Panel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>



<style>

*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}

body{background:#f5f2fa;color:#21172b}

header{background:#160d20;color:white;padding:20px;text-align:center}

header h1{color:#c77dff}

.container{max-width:1000px;margin:25px auto;padding:15px}

.card{background:white;padding:20px;margin-bottom:20px;border-radius:12px;box-shadow:0 3px 15px #0001}

h2{margin-bottom:15px;color:#652b91}

input,textarea,select{width:100%;padding:12px;margin:7px 0 14px;border:1px solid #ccc;border-radius:7px}

textarea{min-height:80px}

button{background:#7838b5;color:white;border:0;padding:11px 17px;border-radius:7px;cursor:pointer;margin:4px}

button.danger{background:#c03955}

button.secondary{background:#555}

.hidden{display:none}

.product{border:1px solid #ddd;padding:12px;margin:10px 0;border-radius:8px}

.product img{width:75px;height:75px;object-fit:contain}

.status{margin:10px 0;font-weight:bold}

.tabs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:15px}

</style>

</head>



<body>

<header>

<h1>WORTHY PICK</h1>

<p>Admin Dashboard</p>

</header>



<div class="container">



<div class="card" id="loginBox">

<h2>Admin Login</h2>

<label>Email</label>

<input id="email" type="email" placeholder="Enter admin email">

<label>Password</label>

<input id="password" type="password" placeholder="Enter password">

<button onclick="login()">Login</button>

<p class="status" id="loginStatus"></p>

</div>



<div id="dashboard" class="hidden">



<div class="card">

<h2>Welcome, Admin!</h2>

<button class="secondary" onclick="logout()">Logout</button>

<p id="message" class="status"></p>

</div>



<div class="tabs">

<button onclick="showTab('productSection')">Products</button>

<button onclick="showTab('categorySection')">Categories</button>

</div>



<div class="card" id="productSection">

<h2 id="formTitle">Add New Product</h2>



<input type="hidden" id="productId">



<label>Product Name</label>

<input id="name" placeholder="Product name">



<label>Description</label>

<textarea id="description" placeholder="Product description"></textarea>



<label>Price (₹)</label>

<input id="price" type="number" placeholder="Selling price">



<label>Old Price (₹)</label>

<input id="oldPrice" type="number" placeholder="Original price">



<label>Product Image</label>

<input id="image" type="file" accept="image/*">



<label>Category</label>

<select id="category">

<option value="">Select category</option>

</select>



<label>Shopping Platform</label>

<select id="marketplace">

<option>Amazon</option>

<option>Flipkart</option>

<option>Meesho</option>

<option>Shopsy</option>

<option>Other</option>

</select>



<label>Product Link</label>

<input id="marketplaceUrl" type="url" placeholder="https://">



<label>Size</label>

<input id="size" placeholder="Example: Free Size / M / L">



<label>Availability</label>

<select id="availability">

<option value="Available">Available</option>

<option value="Not Available">Not Available</option>

</select>



<label>Rating</label>

<input id="rating" type="number" min="0" max="5" step="0.1">



<label>Review Count</label>

<input id="reviewCount" type="number">



<label>Return Policy</label>

<select id="returnPolicy">

<option value="Yes">Yes</option>

<option value="No">No</option>

</select>



<label><input type="checkbox" id="featured"> Featured Product</label>

<br>

<label><input type="checkbox" id="visible" checked> Visible on Website</label>

<br><br>



<button onclick="saveProduct()">Save Product</button>

<button class="secondary" onclick="resetForm()">Clear Form</button>



</div>



<div class="card" id="categorySection">

<h2>Manage Categories</h2>

<input id="categoryName" placeholder="New category name">

<input id="categoryDescription" placeholder="Category description">

<button onclick="addCategory()">Add Category</button>

<div id="categoryList"></div>

</div>



<div class="card">

<h2>All Products</h2>

<div id="productList">Loading products...</div>

</div>



</div>

</div>



<script>

const SUPABASE_URL = "https://uzgzlbjjfukvzttupgre.supabase.co";



const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_l-UkdgwLnHVwinuq-bPmoQ_07TGDCwN";



const client = supabase.createClient(

SUPABASE_URL,

SUPABASE_PUBLISHABLE_KEY

);



let categories = [];



function showMessage(text){

document.getElementById("message").textContent=text;

}



async function login(){

const email=document.getElementById("email").value;

const password=document.getElementById("password").value;



const status=document.getElementById("loginStatus");

status.textContent="Checking login...";



const {data,error}=await client.auth.signInWithPassword({

email,password

});



if(error){

status.textContent=error.message;

return;

}



const {data:isAdmin,error:adminError}=await client.rpc("is_admin");



if(adminError || !isAdmin){

  await client.auth.signOut();

  status.textContent="Admin access denied.";

  return;

}







document.getElementById("loginBox").classList.add("hidden");

document.getElementById("dashboard").classList.remove("hidden");



await loadCategories();

await loadProducts();

}



async function logout(){

await client.auth.signOut();

location.reload();

}



function showTab(id){

document.getElementById("productSection").classList.add("hidden");

document.getElementById("categorySection").classList.add("hidden");

document.getElementById(id).classList.remove("hidden");

}



async function loadCategories(){

const {data,error}=await client

.from("categories")

.select("*")

.order("id");



if(error){

showMessage(error.message);

return;

}



categories=data||[];



const select=document.getElementById("category");

select.innerHTML='<option value="">Select category</option>';



categories.forEach(c=>{

select.innerHTML+=`<option value="${c.id}">${escapeHTML(c.name)}</option>`;

});



const list=document.getElementById("categoryList");

list.innerHTML="";



categories.forEach(c=>{

list.innerHTML+=`

<div class="product">

<strong>${escapeHTML(c.name)}</strong>

<button class="danger" onclick="deleteCategory(${c.id})">Delete</button>

</div>`;

});

}



async function addCategory(){

const name=document.getElementById("categoryName").value.trim();

const description=document.getElementById("categoryDescription").value.trim();



if(!name){

alert("Enter category name");

return;

}



const {error}=await client.from("categories").insert({

name,description,is_visible:true

});



if(error){

alert(error.message);

return;

}



document.getElementById("categoryName").value="";

document.getElementById("categoryDescription").value="";

await loadCategories();

alert("Category added!");

}



async function deleteCategory(id){

if(!confirm("Delete this category?"))return;



const {error}=await client.from("categories").delete().eq("id",id);



if(error){

alert(error.message);

return;

}



await loadCategories();

}



async function saveProduct(){

const id=document.getElementById("productId").value;



const name=document.getElementById("name").value.trim();

const description=document.getElementById("description").value;

const price=Number(document.getElementById("price").value);

const categoryId=document.getElementById("category").value;



if(!name || !price || !categoryId){

alert("Product name, price and category are required.");

return;

}



let imageUrl=null;

const file=document.getElementById("image").files[0];



if(file){

const path=Date.now()+"_"+file.name.replace(/[^a-zA-Z0-9._-]/g,"_");



const {error:uploadError}=await client.storage

.from("product-image")

.upload(path,file,{upsert:false});



if(uploadError){

alert("Image upload failed: "+uploadError.message);

return;

}



const {data:urlData}=client.storage

.from("product-image")

.getPublicUrl(path);



imageUrl=urlData.publicUrl;

}



const product={

name,

description,

price,

old_price:document.getElementById("oldPrice").value || null,

category_id:Number(categoryId),

marketplace:document.getElementById("marketplace").value,

marketplace_url:document.getElementById("marketplaceUrl").value,

size:document.getElementById("size").value,

availability:document.getElementById("availability").value,

rating:document.getElementById("rating").value || null,

review_count:document.getElementById("reviewCount").value || 0,

return_policy:document.getElementById("returnPolicy").value,

is_featured:document.getElementById("featured").checked,

is_visible:document.getElementById("visible").checked,

updated_at:new Date().toISOString()

};



if(imageUrl)product.image_url=imageUrl;



let result;



if(id){

result=await client.from("products").update(product).eq("id",id);

}else{

result=await client.from("products").insert(product);

}



if(result.error){

alert(result.error.message);

return;

}



alert("Product saved successfully!");

resetForm();

await loadProducts();

}



async function loadProducts(){

const {data,error}=await client

.from("products")

.select("*")

.order("id",{ascending:false});



const list=document.getElementById("productList");



if(error){

list.textContent=error.message;

return;

}



if(!data || data.length===0){

list.textContent="No products added yet.";

return;

}



list.innerHTML="";



data.forEach(p=>{

list.innerHTML+=`

<div class="product">

<strong>${escapeHTML(p.name)}</strong>

<p>₹${p.price} | ${escapeHTML(p.marketplace||"")}</p>

<p>${p.is_visible?"Visible":"Hidden"}</p>

<button onclick="editProduct(${p.id})">Edit</button>

<button class="danger" onclick="deleteProduct(${p.id})">Delete</button>

</div>`;

});

}



async function editProduct(id){

const {data,error}=await client.from("products").select("*").eq("id",id).single();



if(error){

alert(error.message);

return;

}



document.getElementById("productId").value=data.id;

document.getElementById("name").value=data.name||"";

document.getElementById("description").value=data.description||"";

document.getElementById("price").value=data.price||"";

document.getElementById("oldPrice").value=data.old_price||"";

document.getElementById("category").value=data.category_id||"";

document.getElementById("marketplace").value=data.marketplace||"Amazon";

document.getElementById("marketplaceUrl").value=data.marketplace_url||"";

document.getElementById("size").value=data.size||"";

document.getElementById("availability").value=data.availability||"Available";

document.getElementById("rating").value=data.rating||"";

document.getElementById("reviewCount").value=data.review_count||0;

document.getElementById("returnPolicy").value=data.return_policy||"No";

document.getElementById("featured").checked=!!data.is_featured;

document.getElementById("visible").checked=!!data.is_visible;



document.getElementById("formTitle").textContent="Edit Product";

showTab("productSection");

window.scrollTo(0,0);

}



async function deleteProduct(id){

if(!confirm("Are you sure you want to delete this product?"))return;



const {error}=await client.from("products").delete().eq("id",id);



if(error){

alert(error.message);

return;

}



await loadProducts();

}



function resetForm(){

document.getElementById("productId").value="";

document.getElementById("formTitle").textContent="Add New Product";



[

"name","description","price","oldPrice","image",

"marketplaceUrl","size","rating","reviewCount"

].forEach(id=>document.getElementById(id).value="");



document.getElementById("category").value="";

document.getElementById("featured").checked=false;

document.getElementById("visible").checked=true;

}



function escapeHTML(value){

return String(value??"").replace(/[&<>"']/g,char=>({

"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"

}[char]));

}

</script>

</body>

</html>
